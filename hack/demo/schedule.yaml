# Backs up the app database every minute and keeps only the newest 2 backups.
apiVersion: planb.io/v1alpha1
kind: Schedule
metadata:
  name: app-every-minute
  namespace: planb-demo
spec:
  schedule: "* * * * *"
  keepLast: 2
  template:
    storageLocation: default
    ttl: 1h
    postgres:
      host: postgres.planb-demo.svc
      sslMode: disable
      credentials: { name: postgres-credentials }
      databases: [app]
