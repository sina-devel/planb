{{- if .Values.ui.enabled }}
{{- $name := printf "%s-ui" (include "planb.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
rules:
  - apiGroups: [planb.io]
    resources: [backups, restores, schedules, backupstoragelocations]
    verbs: [get, list, watch]
  {{- if not .Values.ui.readOnly }}
  - apiGroups: [planb.io]
    resources: [backups, restores]
    verbs: [create, delete]
  - apiGroups: [planb.io]
    resources: [schedules]
    verbs: [patch]
  {{- end }}
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.ui.auth.username (not .Values.ui.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planb.uiAuthSecret" . }}
  labels: {{- include "planb.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.ui.auth.username | quote }}
  password: {{ required "ui.auth.password is required when ui.auth.username is set" .Values.ui.auth.password | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planb
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "planb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [ui, --bind-address=:8090]
          env:
            - name: PLANB_UI_READ_ONLY
              value: {{ .Values.ui.readOnly | quote }}
            {{- with .Values.ui.namespace }}
            - name: PLANB_UI_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.ui.auth.username .Values.ui.auth.existingSecret }}
            - name: PLANB_UI_USERNAME
              valueFrom: { secretKeyRef: { name: {{ include "planb.uiAuthSecret" . }}, key: username } }
            - name: PLANB_UI_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "planb.uiAuthSecret" . }}, key: password } }
            {{- end }}
          ports:
            - { name: http, containerPort: 8090 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - { name: http, port: {{ .Values.ui.service.port }}, targetPort: http }
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "planb.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ui.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ui.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: { name: http }
{{- end }}
{{- end }}
