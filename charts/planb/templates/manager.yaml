apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "planb.fullname" . }}
  labels: {{- include "planb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "planb.fullname" . }}
  labels: {{- include "planb.labels" . | nindent 4 }}
rules:
  - apiGroups: [planb.io]
    resources: [backups, restores, schedules, backupstoragelocations, notifiers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [planb.io]
    resources: [backups/status, restores/status, schedules/status, backupstoragelocations/status, notifiers/status]
    verbs: [get, update, patch]
  - apiGroups: [planb.io]
    resources: [backups/finalizers, restores/finalizers]
    verbs: [update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets, namespaces]
    verbs: [get]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "planb.fullname" . }}
  labels: {{- include "planb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "planb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "planb.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "planb.fullname" . }}
  labels: {{- include "planb.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planb
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: {{ include "planb.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "planb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - manager
            - --leader-elect={{ gt (int .Values.manager.replicas) 1 }}
            - --default-backup-ttl={{ .Values.manager.defaultBackupTTL }}
            - --job-ttl-seconds={{ .Values.manager.jobTTLSeconds }}
            - --zap-log-level={{ .Values.manager.logLevel }}
            {{- with .Values.manager.watchNamespace }}
            - --watch-namespace={{ . }}
            {{- end }}
          env:
            - name: PLANB_AGENT_IMAGE
              value: {{ .Values.manager.agentImage | default (include "planb.image" .) | quote }}
            - name: PLANB_AGENT_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy }}
            {{- with .Values.manager.clusterName }}
            - name: PLANB_CLUSTER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.manager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
          resources: {{- toYaml .Values.manager.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
