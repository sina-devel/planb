---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: notifiers.planb.io
spec:
  group: planb.io
  names:
    kind: Notifier
    listKind: NotifierList
    plural: notifiers
    singular: notifier
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.type
      name: Type
      type: string
    - jsonPath: .spec.events
      name: Events
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastSentTime
      name: Last Sent
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Notifier sends a message when Backups or Restores in its namespace
          complete or fail.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              email:
                description: EmailNotifier sends mail through an SMTP server.
                properties:
                  credentials:
                    description: Credentials for SMTP AUTH (PLAIN). Omit for servers
                      without authentication.
                    properties:
                      name:
                        description: Name of the Secret.
                        type: string
                      passwordKey:
                        default: password
                        type: string
                      usernameKey:
                        default: username
                        type: string
                    required:
                    - name
                    type: object
                  from:
                    description: From address.
                    minLength: 1
                    type: string
                  host:
                    description: Host of the SMTP server.
                    minLength: 1
                    type: string
                  port:
                    default: 587
                    format: int32
                    type: integer
                  skipTLSVerify:
                    description: SkipTLSVerify disables certificate verification.
                    type: boolean
                  tls:
                    default: StartTLS
                    description: 'TLS: StartTLS (required upgrade, usually port 587),
                      TLS (implicit, usually 465) or None.'
                    enum:
                    - StartTLS
                    - TLS
                    - None
                    type: string
                  to:
                    description: To addresses.
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - from
                - host
                - to
                type: object
              events:
                default:
                - BackupFailed
                - RestoreFailed
                description: Events to notify about.
                items:
                  description: NotificationEvent is something a Notifier can be told
                    about.
                  enum:
                  - BackupCompleted
                  - BackupFailed
                  - RestoreCompleted
                  - RestoreFailed
                  type: string
                minItems: 1
                type: array
              selector:
                description: |-
                  Selector limits notifications to Backups/Restores with matching labels,
                  e.g. {matchLabels: {planb.io/schedule: nightly}}. Empty matches everything in the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              slack:
                description: SlackNotifier posts to a Slack incoming webhook. Mattermost
                  and Rocket.Chat accept the same format.
                properties:
                  channel:
                    description: Channel overrides the webhook's default channel (where
                      supported).
                    type: string
                  webhookURL:
                    description: WebhookURL of the incoming webhook.
                    properties:
                      key:
                        description: Key in the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - webhookURL
                type: object
              suspend:
                description: Suspend stops sending notifications.
                type: boolean
              telegram:
                description: TelegramNotifier sends messages through a Telegram bot.
                properties:
                  apiURL:
                    default: https://api.telegram.org
                    description: APIURL of the Bot API, for a self-hosted Bot API
                      server or a reverse proxy.
                    type: string
                  botToken:
                    description: BotToken of the bot.
                    properties:
                      key:
                        description: Key in the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  chatID:
                    description: ChatID of a user, group or channel (e.g. -1001234567890
                      or @channelname).
                    minLength: 1
                    type: string
                required:
                - botToken
                - chatID
                type: object
              webhook:
                properties:
                  headers:
                    additionalProperties:
                      type: string
                    description: Headers added to every request, e.g. Authorization.
                    type: object
                  url:
                    description: URL receiving a JSON POST for every event.
                    type: string
                  urlSecret:
                    description: URLSecret reads the URL from a Secret, for URLs that
                      embed a token.
                    properties:
                      key:
                        description: Key in the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of url or urlSecret is required
                  rule: has(self.url) != has(self.urlSecret)
            type: object
            x-kubernetes-validations:
            - message: exactly one of webhook, slack, telegram or email is required
              rule: '[has(self.webhook), has(self.slack), has(self.telegram), has(self.email)].filter(x,
                x).size() == 1'
          status:
            properties:
              lastFailureTime:
                description: LastFailureTime of the last failed notification.
                format: date-time
                type: string
              lastSentTime:
                description: LastSentTime of the last successful notification.
                format: date-time
                type: string
              lastTestRequest:
                description: LastTestRequest is the value of the planb.io/test annotation
                  that was last handled.
                type: string
              message:
                description: Message describes the last failure, if any.
                type: string
              phase:
                type: string
              type:
                description: Type of the configured channel.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
