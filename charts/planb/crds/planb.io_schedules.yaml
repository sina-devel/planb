---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: schedules.planb.io
spec:
  group: planb.io
  names:
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    singular: schedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.lastBackup
      name: Last Backup
      type: string
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schedule creates Backups periodically.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduleSpec defines the desired state of Schedule.
            properties:
              keepLast:
                description: KeepLast deletes the oldest completed backups of this
                  schedule beyond this count (0 = rely on TTL only).
                format: int32
                minimum: 0
                type: integer
              paused:
                description: Paused stops new backups from being created.
                type: boolean
              schedule:
                description: |-
                  Schedule in cron format (5 fields). "CRON_TZ=Europe/Berlin 0 3 * * *" and
                  descriptors such as "@daily" or "@every 6h" are supported.
                minLength: 1
                type: string
              skipIfRunning:
                default: true
                description: SkipIfRunning does not create a new backup while a previous
                  one from this schedule is still running.
                type: boolean
              template:
                description: Template of the Backups created by this schedule.
                properties:
                  bucket:
                    description: BucketBackupSource copies all objects of a bucket
                      (optionally under a prefix).
                    properties:
                      bucket:
                        description: Bucket name.
                        minLength: 1
                        type: string
                      credentials:
                        description: Credentials secret. When omitted, anonymous /
                          IAM-provided credentials are used.
                        properties:
                          accessKeyIdKey:
                            default: accessKey
                            description: Key holding the access key ID.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          secretAccessKeyKey:
                            default: secretKey
                            description: Key holding the secret access key.
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Endpoint host[:port], without scheme. e.g. s3.amazonaws.com
                          or minio.minio.svc:9000
                        minLength: 1
                        type: string
                      insecure:
                        description: Insecure uses plain HTTP instead of HTTPS.
                        type: boolean
                      prefix:
                        description: Prefix inside the bucket.
                        type: string
                      region:
                        description: Region of the bucket.
                        type: string
                      skipTLSVerify:
                        description: SkipTLSVerify disables TLS certificate verification.
                        type: boolean
                    required:
                    - bucket
                    - endpoint
                    type: object
                  job:
                    description: JobOptions customise the Job that performs a backup
                      or restore.
                    properties:
                      activeDeadlineSeconds:
                        format: int64
                        type: integer
                      backoffLimit:
                        default: 1
                        format: int32
                        type: integer
                      image:
                        description: Image overrides the agent image (it must contain
                          the planb binary and PostgreSQL client tools).
                        type: string
                      nodeSelector:
                        additionalProperties:
                          type: string
                        type: object
                      resources:
                        description: ResourceRequirements describes the compute resource
                          requirements.
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This field depends on the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
                            items:
                              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                              properties:
                                name:
                                  description: |-
                                    Name must match the name of one entry in pod.spec.resourceClaims of
                                    the Pod where this field is used. It makes that resource available
                                    inside a container.
                                  type: string
                                request:
                                  description: |-
                                    Request is the name chosen for a request in the referenced claim.
                                    If empty, everything from the claim is made available, otherwise
                                    only the result of this request.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Limits describes the maximum amount of compute resources allowed.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Requests describes the minimum amount of compute resources required.
                              If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                              otherwise to an implementation-defined value. Requests cannot exceed Limits.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                        type: object
                      serviceAccountName:
                        type: string
                      tolerations:
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                                Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
                    type: object
                  postgres:
                    description: PostgresBackupSource backs up databases from a PostgreSQL
                      server.
                    properties:
                      credentials:
                        description: Credentials secret.
                        properties:
                          name:
                            description: Name of the Secret.
                            type: string
                          passwordKey:
                            default: password
                            type: string
                          usernameKey:
                            default: username
                            type: string
                        required:
                        - name
                        type: object
                      databases:
                        description: |-
                          Databases to dump with pg_dump (custom format). When empty, the whole
                          cluster is dumped with pg_dumpall (plain SQL, gzipped).
                        items:
                          type: string
                        type: array
                      extraArgs:
                        description: ExtraArgs appended to the pg_dump / pg_dumpall
                          command line.
                        items:
                          type: string
                        type: array
                      host:
                        description: Host of the PostgreSQL server.
                        minLength: 1
                        type: string
                      includeGlobals:
                        description: |-
                          IncludeGlobals also dumps roles and tablespaces (pg_dumpall --globals-only)
                          when specific databases are listed.
                        type: boolean
                      port:
                        default: 5432
                        format: int32
                        type: integer
                      sslMode:
                        default: prefer
                        description: SSLMode passed to libpq (disable, allow, prefer,
                          require, verify-ca, verify-full).
                        enum:
                        - disable
                        - allow
                        - prefer
                        - require
                        - verify-ca
                        - verify-full
                        type: string
                    required:
                    - credentials
                    - host
                    type: object
                  storageLocation:
                    description: StorageLocation is the name of a BackupStorageLocation
                      in the same namespace.
                    minLength: 1
                    type: string
                  ttl:
                    description: TTL after which the backup and its data are deleted.
                      Defaults to 720h (30 days).
                    type: string
                required:
                - storageLocation
                type: object
                x-kubernetes-validations:
                - message: exactly one of postgres or bucket must be set
                  rule: has(self.postgres) != has(self.bucket)
            required:
            - schedule
            - template
            type: object
          status:
            description: ScheduleStatus defines the observed state of Schedule.
            properties:
              lastBackup:
                type: string
              lastScheduleTime:
                format: date-time
                type: string
              message:
                type: string
              nextScheduleTime:
                format: date-time
                type: string
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
